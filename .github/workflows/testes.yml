name: Validar portfólio CP4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir lógica e sintaxe
        run: |
          node --check js/scripts.js
          node testes/verificar.js
      - name: Instalar navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testar páginas no navegador
        run: |
          python3 -m http.server 8766 > /tmp/portfolio-http.log 2>&1 &
          node testes/navegador.cjs
